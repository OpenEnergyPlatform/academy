name: gh-pages
on:
  push:
    branches:
      - production
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install -r requirements.txt
      - run: pushd utils/mkdocs_oep && python setup.py develop && popd
      - run: cd $GITHUB_WORKSPACE && mkdocs gh-deploy --force --config-file mkdocs.yml
